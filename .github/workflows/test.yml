name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installeer dependencies
        run: npm install --no-audit --no-fund
      - name: Installeer Chromium
        run: npx playwright install --with-deps chromium
      - name: Rekentool en presentaties testen
        run: npm test
